<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bhunetraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0c0d14"/>
  <!-- Netra: Outer Satellite Eye Contour -->
  <path d="M 6 32 C 16 14, 48 14, 58 32 C 48 50, 16 50, 6 32 Z" fill="none" stroke="url(#bhunetraGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bhu: Central Earth Globe -->
  <circle cx="32" cy="32" r="12" fill="url(#earthGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Vegetative Core / Pupil -->
  <circle cx="32" cy="32" r="6" fill="#10b981"/>
  <!-- Satellite Orbit Arc -->
  <path d="M 20 20 C 26 12, 44 14, 48 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Orbiting Satellite Point -->
  <circle cx="48" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="48" cy="24" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
</svg>
